# M0 기술 검증용 임시 워크플로. 검증 후 삭제한다.
name: M0 Spike

on:
  pull_request:

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test -d windows integration_test/m0_spike_test.dart --dart-define=N=500
